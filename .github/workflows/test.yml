name: Cask validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: repository contract
    runs-on: ubuntu-24.04
    outputs:
      cask_present: ${{ steps.cask.outputs.present }}
      version: ${{ steps.cask.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned ShellCheck release
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location "$url" | tar -xJ
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Run repository contract tests
        run: |
          shellcheck --severity=warning scripts/*.sh
          scripts/test-repository.sh

      - name: Detect a published Cask
        id: cask
        run: |
          set -euo pipefail
          if [ ! -f Casks/artifactbridge.rb ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(ruby -ne 'puts $1 if $_ =~ /^  version "([^"]+)"$/' Casks/artifactbridge.rb)"
          case "$version" in
            '' | *[!0-9.]*) echo "invalid Cask version: $version" >&2; exit 1 ;;
          esac
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cask:
    name: ${{ matrix.architecture }} Cask
    needs: repository-contract
    if: needs.repository-contract.outputs.cask_present == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            runner: macos-15
          - architecture: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Register this checkout as the tap
        run: brew tap omnim-ai/tap "$GITHUB_WORKSPACE"

      - name: Run Homebrew validation
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew style omnim-ai/tap/artifactbridge
          brew audit --cask --strict omnim-ai/tap/artifactbridge
          brew livecheck --cask omnim-ai/tap/artifactbridge

      - name: Prove Homebrew does not change user exposure
        run: |
          set -euo pipefail
          for profile in .zprofile .zshrc .bash_profile .bashrc .profile; do
            path="$HOME/$profile"
            if [ -f "$path" ]; then
              shasum -a 256 "$path" >> "$RUNNER_TEMP/profiles.before"
            fi
          done

      - name: Install and verify the Cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install --cask omnim-ai/tap/artifactbridge
          scripts/test-installed-cask.sh "${{ needs.repository-contract.outputs.version }}"

      - name: Verify shell profiles are unchanged
        if: always()
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/profiles.after"
          for profile in .zprofile .zshrc .bash_profile .bashrc .profile; do
            path="$HOME/$profile"
            if [ -f "$path" ]; then
              shasum -a 256 "$path" >> "$RUNNER_TEMP/profiles.after"
            fi
          done
          if [ -f "$RUNNER_TEMP/profiles.before" ]; then
            diff -u "$RUNNER_TEMP/profiles.before" "$RUNNER_TEMP/profiles.after"
          else
            test ! -s "$RUNNER_TEMP/profiles.after"
          fi
